<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPredictor</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar/Controls -->
        <aside class="sidebar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <h2>LeadPredictor</h2>
            </div>
            
            <div class="form-group">
                <label>Language</label>
                <select><option>ðŸ‡ºðŸ‡¸ English</option></select>
            </div>
            <div class="form-group">
                <label>Currency</label>
                <select><option>$ US Dollar</option></select>
            </div>
            <div class="form-group">
                <label>Campaign Start</label>
                <input type="date" value="2025-05-08">
            </div>
            <div class="form-group">
                <label>Campaign End</label>
                <input type="date" value="2025-11-04">
            </div>
            
            <div class="form-group">
                <label>Total Revenue</label>
                <div class="input-icon">
                    <span>$</span>
                    <input type="number" id="totalRevenue" value="10000">
                </div>
            </div>
            
            <div class="form-group">
                <label>Avg. Order Value</label>
                <div class="input-icon">
                    <span>$</span>
                    <input type="number" id="avgOrderValue" value="1000">
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="top-section">
                <!-- Chart Area -->
                <div class="chart-area">
                    <div class="chart-title-y">Months</div>
                    <div class="chart-container">
                        <div class="chart-row" id="row-5" data-month="5">
                            <span class="month-label">5</span>
                            <div class="bar-track">
                                <div class="bar bar-prospects" id="bar-p-5"></div>
                                <div class="bar bar-leads" id="bar-l-5"></div>
                                <div class="bar bar-customers" id="bar-c-5"></div>
                            </div>
                        </div>
                        <div class="chart-row" id="row-4" data-month="4">
                            <span class="month-label">4</span>
                            <div class="bar-track">
                                <div class="bar bar-prospects" id="bar-p-4"></div>
                                <div class="bar bar-leads" id="bar-l-4"></div>
                                <div class="bar bar-customers" id="bar-c-4"></div>
                            </div>
                        </div>
                        <div class="chart-row" id="row-3" data-month="3">
                            <span class="month-label">3</span>
                            <div class="bar-track">
                                <div class="bar bar-prospects" id="bar-p-3"></div>
                                <div class="bar bar-leads" id="bar-l-3"></div>
                                <div class="bar bar-customers" id="bar-c-3"></div>
                            </div>
                        </div>
                        <div class="chart-row" id="row-2" data-month="2">
                            <span class="month-label">2</span>
                            <div class="bar-track">
                                <div class="bar bar-prospects" id="bar-p-2"></div>
                                <div class="bar bar-leads" id="bar-l-2"></div>
                                <div class="bar bar-customers" id="bar-c-2"></div>
                            </div>
                        </div>
                        <div class="chart-row" id="row-1" data-month="1">
                            <span class="month-label">1</span>
                            <div class="bar-track">
                                <div class="bar bar-prospects" id="bar-p-1"></div>
                                <div class="bar bar-leads" id="bar-l-1"></div>
                                <div class="bar bar-customers" id="bar-c-1"></div>
                            </div>
                        </div>
                        <div class="chart-x-axis">
                            <span>0 people</span>
                            <span>20 people</span>
                            <span>40 people</span>
                            <span>60 people</span>
                            <span>80 people</span>
                            <span>100 people</span>
                            <span>120 people</span>
                        </div>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="stats-area">
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title"><span class="dot" style="background-color: var(--prospects-color)"></span> Prospects</div>
                            <div class="stat-percent" id="prospectsPercent">100%</div>
                        </div>
                        <div class="stat-value" id="prospectsResult">125</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title"><span class="dot" style="background-color: var(--leads-color)"></span> Leads</div>
                            <div class="stat-percent" id="leadsPercent">20%</div>
                        </div>
                        <div class="stat-value" id="leadsResult">25</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <div class="stat-title"><span class="dot" style="background-color: var(--customers-color)"></span> Customers</div>
                            <div class="stat-percent" id="customersPercent">8%</div>
                        </div>
                        <div class="stat-value" id="customersResult">10</div>
                    </div>
                </div>
            </div>

            <div class="bottom-section">
                <div class="slider-group">
                    <div class="slider-header">
                        <label>Lead Response Rate</label>
                        <span id="leadResponseRateVal">40.00%</span>
                    </div>
                    <input type="range" id="leadResponseRate" min="0" max="100" step="0.01" value="40">
                </div>
                <div class="slider-group">
                    <div class="slider-header">
                        <label>Prospect Response Rate</label>
                        <span id="prospectResponseRateVal">20.00%</span>
                    </div>
                    <input type="range" id="prospectResponseRate" min="0" max="100" step="0.01" value="20">
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
